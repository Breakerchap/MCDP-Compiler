[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mcdp-compiler"
version = "0.1.0"
description = "A small mcfunction superset that transpiles a single .mcdp file into a Java Edition datapack."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Breakerchap"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
mcdp = "mcdp_compiler.cli:main"

[tool.setuptools.packages.find]
include = ["mcdp_compiler*"]
